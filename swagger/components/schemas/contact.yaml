type: object
required:
  - _id
    - name
    - phoneNumber
    - contactType
    - userId
properties:
  _id:
    description: "Contacts's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contacts's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: '+380(11)111-11-11'
  email:
    description: "Contact's email"
    type: string
    example: 'example@gmail.com'
  isFavourite:
    description: 'Contact is in Favourite'
    type: boolean
    example: true
  contactType:
    description: "Contact's number type"
    type: string
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54fa6
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.jpg
